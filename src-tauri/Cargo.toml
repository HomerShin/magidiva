[package]
name = "magidiva"
version = "0.1.0"
description = "MagiDiva — AI bulk product image processor for e-commerce sellers"
authors = ["MagiDiva <hello@magidiva.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "magidiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
ort = { version = "2.0.0-rc.15", features = ["directml", "download-binaries", "copy-dylibs"] }
walkdir = "2"
ureq = { version = "2", features = ["tls", "native-certs"] }
urlencoding = "2"
once_cell = "1"
bytemuck = { version = "1", features = ["derive"] }

[features]
default = []
pro = []


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
